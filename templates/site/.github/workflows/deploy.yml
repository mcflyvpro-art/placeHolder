name: Qualité et mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_MODE: ${{ vars.SITE_MODE || 'preview' }}
      PH_APP_ORIGIN: ${{ vars.PH_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Qualité
        id: quality
        continue-on-error: true
        run: npm run quality

      # En aperçu on publie toujours (pour itérer) ; en production, un contrôle raté bloque la mise en ligne.
      - name: Bloquer la production si la qualité échoue
        if: env.SITE_MODE == 'production' && steps.quality.outcome == 'failure'
        run: exit 1

      - name: Mise en ligne Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUT=$(npx --yes wrangler@4 pages deploy dist --project-name "${{ vars.PAGES_PROJECT }}" --branch main --commit-dirty=true 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUT" | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Prévenir placeHolder
        if: always() && vars.PH_WEBHOOK_URL != ''
        env:
          SECRET: ${{ secrets.SITE_WEBHOOK_SECRET }}
        run: |
          QUALITY=$(cat quality.json 2>/dev/null || echo 'null')
          MSG=$(git log -1 --pretty=%s | head -c 200)
          BODY=$(jq -nc \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg message "$MSG" \
            --arg url "${{ steps.deploy.outputs.url }}" \
            --arg status "${{ steps.deploy.outcome }}" \
            --argjson quality "$QUALITY" \
            '{repo:$repo, sha:$sha, message:$message, url:$url, status:$status, quality:$quality}')
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
          curl -fsS -X POST "${{ vars.PH_WEBHOOK_URL }}" -H "Content-Type: application/json" -H "X-PH-Signature: $SIG" -d "$BODY"
